<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%236425FE'/%3E%3Ctext x='32' y='45' font-size='34' font-weight='800' text-anchor='middle' fill='white' font-family='Arial,sans-serif'%3E%E2%82%A9%3C/text%3E%3C/svg%3E">
<title>주가 KPI — SK이노베이션 CEO KPI 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="layout">
  <aside>
    <div class="logo">
      <div class="mark">₩</div>
      <div><b>주가<span style="color:var(--primary)">:</span>KPI</b><br><small>SK이노베이션 CEO KPI</small></div>
    </div>
    <div>
      <div class="nav-h">메뉴</div>
      <div class="nav-main" id="mainNav"></div>
    </div>
    <div>
      <div class="nav-h">평가 대상</div>
      <div id="tickerList"></div>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div class="row">
        <div class="tabs" id="subtabs"></div>
        <details class="changelog" id="changelogBox">
          <summary>📜 변경이력</summary>
          <div class="changelog-panel" id="changelogList"></div>
        </details>
        <div class="today" id="todayStr"></div>
      </div>
    </div>
    <div class="wrap" id="view">
      <div class="skel"><div class="ln" style="width:26%"></div><div class="ln" style="width:80%;height:18px"></div><div class="ln" style="width:94%"></div><div class="ln" style="width:52%"></div></div>
      <div class="skel"><div class="ln" style="width:22%"></div><div class="ln" style="width:72%;height:18px"></div><div class="ln" style="width:90%"></div><div class="ln" style="width:46%"></div></div>
    </div>
  </main>
</div>
<script src="assets/sim.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
