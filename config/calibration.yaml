# 기준선 버전 및 보정 설정
#
# ⚠️ 113,109원은 KIS 데이터로 재현되지 않는다 (PLAN.md §3).
#    원인 미규명 상태이며, 기획팀 산출 원본 입수가 유일한 확실한 해소 경로다.

# 40점 앵커의 3가지 버전.
#   V3 는 연초 안내값, V2 는 수기 검산으로 확정한 최종 방식 목표값이다.
#   V1 은 KIS 데이터로 자체 산출한다.
baselines:
  V3:
    label: "공식 (연초 안내값)"
    source: fixed
    value: 113109
    official: true
  V1:
    label: "재현 · 2개월 VWAP"
    source: computed          # 기준일의 2M VWAP 을 앵커로 사용
    mode: 잠정
    official: false
  V2:
    label: "최종 방식 목표 (수기 검산)"
    source: fixed
    value: 109922
    official: false

# 전역 보정계수. "보정 없이 그대로 사용" 결정에 따라 1.0 고정.
# 값을 바꾸면 SK 거래량보정주가 전체에 곱해진다.
calibration_factor: 1.0

# 발행주식수 변동 이벤트 (유상증자·자사주 소각·액면분할 등).
# 자동 적용하지 않는다. 사람이 계수를 확정해 여기 등록해야 반영된다 (PLAN.md §5.2).
# 등록 시 effective_date 이전 주가에 factor 를 곱한다.
corporate_actions: []
  # - { code: "051910", effective_date: "2026-03-15", factor: 0.95, note: "유상증자 권리락" }

# 감시 대상 — 아직 조정계수를 적용하지 않은 진행 중 이벤트.
# 3단계 DART 스윕(2025-10-01~2026-07-27, 발행공시)에서 확인됐다.
# 9종목 중 지분증권 신고서를 낸 곳은 에코프로비엠 하나뿐이고 나머지는 전부 채무증권이다.
watchlist:
  - code: "247540"
    name: 에코프로비엠
    filed_at: "2026-07-24"
    report: "[기재정정]증권신고서(지분증권)"
    url: "https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260724000429"
    note: >
      지분증권 발행이 진행 중이다. 권리락이 발생하면 주가가 기업가치와 무관하게
      하락하고, 에코프로비엠은 배/소 그룹(가중치 40%)의 1/4이므로 Peer 증감율을
      실질 10% 비중으로 끌어내린다. 그러면 상대 증감율 x 가 올라가 SK 점수가
      인위적으로 상승한다. 2026-07-15 상반기 평가일 이후 제출이라 상반기 실적에는
      영향이 없으나, 10월 잠정평가와 11월 최종평가 전에 권리락일과 조정계수를
      확정해 corporate_actions 에 등록해야 한다.
