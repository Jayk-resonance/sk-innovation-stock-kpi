# Peer 선정 적정성 평가 기준
#
# CEO KPI 산정에 쓰이는 Peer 그룹 선정은 결과 점수에 직접 영향을 주는
# 민감한 변수다(2026-08-13 "Peer 후보 추천" 검토 참조). 표준적인 벤치마크
# 그룹 선정 관행을 따라 4가지 기준으로 평가한다.
#
#   ① 사업 유사도       — SK이노베이션 사업부(정유·화학·배터리·소재)와의 겹침 정도
#   ② 시가총액 비교가능성 — 규모 차이가 너무 크면 그룹 평균이 한 종목에 휘둘린다
#   ③ 거래 유동성        — 일평균 거래대금. VWAP(거래량가중평균) 신뢰도의 전제조건
#   ④ 독립성(이해상충)    — SK그룹 계열사면 사실상 자기 자신과 비교하는 셈이 된다
#
# ②③은 매일 갱신되는 시세·시가총액 데이터로 자동 계산한다(pipeline/build_site.py).
# ①④는 판단이 들어가므로 자동 산출하지 않고 사람이 여기 등록한다 — 근거 없이
# 등급만 매기면 나중에 왜 그런지 아무도 설명 못 한다.
#
# 생산능력 수치는 2026-08-13 웹 검색으로 확인한 최신 공개 자료 기준이며,
# 공정 특성상 계열사·공장별 수치가 기사마다 조금씩 다를 수 있다.
